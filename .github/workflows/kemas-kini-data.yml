# Tarik data Bursa dari Yahoo Finance setiap petang hari bekerja,
# simpan ke docs/data/bursa.json, dan terbitkan website di GitHub Pages.
name: Kemas kini data Bursa

on:
  schedule:
    - cron: "45 10 * * 1-5"   # 10:45 UTC = 6:45 petang waktu Malaysia, Isnin-Jumaat
  workflow_dispatch:           # butang "Run workflow" untuk jalankan sendiri
  push:
    branches: [main]
    paths: ["docs/**"]         # terbitkan semula bila website diubah

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kemas-kini-data
  cancel-in-progress: false

jobs:
  tarik-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Tarik data
        run: python tarik_data_bursa.py --hari 15
      - name: Simpan data ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/data/bursa.json jumlah_saham.csv
          git diff --cached --quiet || git commit -m "Data Bursa $(TZ=Asia/Kuala_Lumpur date +%F)"
          git push
      # Untuk website Next.js (web/): data disimpan dalam storan Supabase yang tertutup.
      # Langkah ini dilangkau sehingga rahsia SUPABASE_URL dan SUPABASE_SECRET_KEY ditambah
      # di GitHub: Settings > Secrets and variables > Actions.
      - name: Muat naik data ke Supabase
        if: env.SUPABASE_URL != ''
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          gzip -9 -c docs/data/bursa.json > bursa.json.gz
          auth=(-H "apikey: $SUPABASE_SECRET_KEY")
          # Kunci lama (service_role, JWT) perlukan juga pengepala Authorization
          case "$SUPABASE_SECRET_KEY" in sb_secret_*) ;; *) auth+=(-H "Authorization: Bearer $SUPABASE_SECRET_KEY") ;; esac
          curl -fsS -X POST "${SUPABASE_URL%/}/storage/v1/object/data/bursa.json.gz" \
            "${auth[@]}" -H "x-upsert: true" -H "Content-Type: application/gzip" \
            -H "Cache-Control: max-age=60" --data-binary @bursa.json.gz
          echo "Data dimuat naik ke Supabase ($(wc -c < bursa.json.gz) bait)."

  terbit:
    needs: tarik-data
    if: always() && (needs.tarik-data.result == 'success' || needs.tarik-data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
